name: Build image and update Helm

on:
  push:
    tags:
      - 'dev-v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/demo-app

    steps:
      # 1️⃣ Клонируем репозиторий с приложением
      - name: Checkout app repo
        uses: actions/checkout@v4

      # 2️⃣ Получаем тег, по которому запустился workflow
      - name: Get tag name
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "Using TAG=$GITHUB_REF_NAME"

      # 3️⃣ Настройка QEMU и Buildx для Docker
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup buildx
        uses: docker/setup-buildx-action@v2

      # 4️⃣ Логинимся в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build и push Docker image
      - name: Build and push image
        run: |
          IMG=${IMAGE_REPO}:${TAG}
          echo "Building image $IMG"
          docker build -t $IMG .
          docker push $IMG

      # 6️⃣ Настройка SSH для доступа к Helm репозиторию
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HELM_REPO_SSH_KEY }}" > ~/.ssh/id_ed25519_git
          chmod 600 ~/.ssh/id_ed25519_git
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # 7️⃣ Клонируем Helm репозиторий через SSH
      - name: Clone Helm repo
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_git -o StrictHostKeyChecking=no" \
          git clone git@github.com:ArtemDzyachenka/demo-app-helm.git helm-repo
          cd helm-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # 8️⃣ Обновляем values.yaml с новым тегом и пушим
      - name: Update values.yaml with new tag
        run: |
          cd helm-repo
          TAG=${{ env.TAG }}
          echo "Updating Helm image tag to $TAG"
          sed -i "s|^  tag:.*|  tag: ${TAG}|" values.yaml || true
          git add values.yaml
          git commit -m "ci: update image tag to ${TAG}" || echo "no changes to commit"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_git -o StrictHostKeyChecking=no" git push origin HEAD
