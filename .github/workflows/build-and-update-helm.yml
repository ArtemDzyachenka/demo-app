name: Build image and update Helm

on:
  push:
    tags:
      - 'dev-v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/demo-app

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Get tag name
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "Using TAG=$GITHUB_REF_NAME"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          IMG=${IMAGE_REPO}:${TAG}
          echo "Building image $IMG"
          docker build -t $IMG .
          docker push $IMG

      - name: Clone Helm repo
        run: |
          # Клонируем репозиторий с использованием Personal Access Token
          git clone https://x-access-token:${{ secrets.HELM_REPO_PAT }}@github.com/USERNAME/demo-app-helm.git helm-repo
          cd helm-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Update values.yaml with new tag
        run: |
          cd helm-repo
          TAG=${{ env.TAG }}
          echo "Updating Helm image tag to $TAG"
          sed -i "s|^  tag:.*|  tag: ${TAG}|" values.yaml || true
          git add values.yaml
          git commit -m "ci: update image tag to ${TAG}" || echo "no changes to commit"
          git push origin HEAD
